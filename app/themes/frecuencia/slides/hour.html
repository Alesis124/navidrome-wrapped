<p class="lead">{{{s.hour_lead}}}</p>
<div class="dial24" data-peak="{{x.peak}}"><span class="sweep"></span>{{#each x.hist}}<i data-h="{{h}}" style="--k:{{@index}};--p:{{pct}}"><b></b></i>{{/each}}<span class="hl" style="--a:0deg">0 {{{s.hours_short}}}</span><span class="hl" style="--a:90deg">6 {{{s.hours_short}}}</span><span class="hl" style="--a:180deg">12 {{{s.hours_short}}}</span><span class="hl" style="--a:270deg">18 {{{s.hours_short}}}</span><div class="mid"><strong class="hero">{{x.peak}}:00</strong></div></div>
<p class="note">{{{s.hour_detail}}}</p>
