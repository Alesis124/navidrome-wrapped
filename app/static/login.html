<!doctype html>
<html lang="es">

<head>
  <script src="js/i18n.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Navidrome Wrapped</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #0b0a10;
      color: #f4efe6;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
    }

    .language-picker { position: fixed; top: max(env(safe-area-inset-top), 12px); right: 12px; }
    .language-picker select { width: auto; max-width: 130px; font: inherit; color: inherit; background: #17151f;
      border: 1px solid #494456; border-radius: 999px; padding: 7px 10px; }
    .language-picker select:focus-visible { outline: 2px solid #ffb02e; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    form {
      width: min(100%, 340px);
      display: grid;
      gap: 14px;
    }

    img {
      width: 72px;
      height: 72px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    p {
      margin: 0;
      opacity: .65;
      font-size: .9rem;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: .85rem;
      opacity: .85;
    }

    input {
      font: inherit;
      color: inherit;
      background: #17151f;
      border: 1px solid #2c2938;
      border-radius: 10px;
      padding: 11px 12px;
    }

    input:focus-visible {
      outline: 2px solid #ffb02e;
      outline-offset: 1px;
    }

    button {
      font: inherit;
      font-weight: 700;
      color: #1a1205;
      background: #ffb02e;
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    #msg {
      min-height: 1.2em;
      color: #ff8a7a;
      font-size: .88rem;
      opacity: 1;
    }
  </style>
</head>

<body>
  <label class="language-picker">
    <select id="language" aria-label="Interface language" title="Interface language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
      <option value="nl">Nederlands</option>
      <option value="ru">Русский</option>
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="ar">العربية</option>
    </select>
  </label>
  <form id="f" autocomplete="on">
    <img src="favicon.svg" alt="">
    <h1>Navidrome Wrapped</h1>
    <p data-i18n="login_intro">Inicia sesión para ver tu resumen.</p>
    <label><span data-i18n="login_user">Usuario</span> <input id="u" name="username" autocomplete="username" autocapitalize="none" required
        autofocus></label>
    <label><span data-i18n="login_password">Contraseña</span> <input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <button id="go" type="submit" data-i18n="login_submit">Entrar</button>
    <p id="msg" role="alert"></p>
  </form>
  <script>
    const f = document.getElementById('f'),
      msg = document.getElementById('msg'),
      go = document.getElementById('go');
    const languageSelect = document.getElementById('language');
    let language = window.NW_I18N.resolveLanguage('en');
    window.NW_I18N.applyLanguage(language);
    languageSelect.addEventListener('change', () => {
      language = languageSelect.value;
      window.NW_I18N.savePreferredLanguage(language);
      const url = new URL(location.href);
      url.searchParams.set('lang', language);
      location.assign(url);
    });
    const languageReady = window.NW_I18N.apiFetch('/api/config').then((r) => r.json()).then((config) => {
      language = window.NW_I18N.resolveLanguage(config.language || 'en');
      window.NW_I18N.applyLanguage(language);
    }).catch((error) => {
      console.error('Could not load language settings', error);
    });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      go.disabled = true;
      await languageReady;
      msg.textContent = '';
      try {
        const r = await window.NW_I18N.apiFetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            user: f.u.value,
            password: f.p.value
          })
        });
        if (r.ok) {
          const next = new URLSearchParams(location.search).get('next') || '/';
          const target = new URL(next.startsWith('/') && !next.startsWith('//') ? next : '/', location.origin);
          if (!target.searchParams.has('lang')) target.searchParams.set('lang', language);
          location.replace(target.pathname + target.search + target.hash);
          return;
        }
        msg.textContent = (await r.json().catch(() => ({}))).detail || window.NW_I18N.messages[language].login.failed;
      } catch {
        msg.textContent = window.NW_I18N.messages[language].login.offline;
      }
      go.disabled = false;
      f.p.select();
    });
  </script>
</body>

</html>
