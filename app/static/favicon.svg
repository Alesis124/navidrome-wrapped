<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Disco de vinilo</title>
  <desc id="desc">Ilustración vectorial de un disco de vinilo negro con surcos concéntricos y etiqueta roja central.</desc>
  <defs>
